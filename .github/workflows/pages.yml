name: Deploy Packwiz packs to Cloudflare Pages

on:
  # Optional manual deployment. Cloudflare Git integration uses scripts/build-pages.py.
  workflow_dispatch:
    inputs:
      project_name:
        description: Cloudflare Pages project name (production branch must be main)
        required: true
        type: string
        default: mc-modpacks

permissions:
  contents: read

concurrency:
  group: cloudflare-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Check Cloudflare configuration
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT_NAME: ${{ inputs.project_name }}
        run: |
          set -euo pipefail
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Set the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets."
            exit 1
          fi
          if [[ ! "$PROJECT_NAME" =~ ^[a-z0-9][a-z0-9-]*[a-z0-9]$ && ! "$PROJECT_NAME" =~ ^[a-z0-9]$ ]]; then
            echo "::error::Use a Cloudflare Pages project name containing lowercase letters, digits, and internal hyphens."
            exit 1
          fi

      - name: Build Packwiz site
        run: python3 scripts/build-pages.py

      # Repository secrets:
      # CLOUDFLARE_API_TOKEN: Account > Cloudflare Pages > Edit for the target account.
      # CLOUDFLARE_ACCOUNT_ID: The account containing the Pages project.
      - name: Deploy to Cloudflare Pages
        id: deployment
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy _site --project-name=${{ inputs.project_name }} --branch=main

      - name: Show deployment URL
        env:
          DEPLOYMENT_URL: ${{ steps.deployment.outputs.deployment-url }}
        run: |
          printf 'Cloudflare Pages deployment: %s\n' "$DEPLOYMENT_URL" >> "$GITHUB_STEP_SUMMARY"
