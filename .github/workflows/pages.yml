name: Deploy Packwiz packs to Cloudflare Pages

on:
  # Run manually after creating a Cloudflare Pages Direct Upload project.
  workflow_dispatch:
    inputs:
      project_name:
        description: Cloudflare Pages project name (production branch must be main)
        required: true
        type: string
        default: mc-modpacks

permissions:
  contents: read

concurrency:
  group: cloudflare-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Check Cloudflare configuration
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT_NAME: ${{ inputs.project_name }}
        run: |
          set -euo pipefail
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Set the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets."
            exit 1
          fi
          if [[ ! "$PROJECT_NAME" =~ ^[a-z0-9][a-z0-9-]*[a-z0-9]$ && ! "$PROJECT_NAME" =~ ^[a-z0-9]$ ]]; then
            echo "::error::Use a Cloudflare Pages project name containing lowercase letters, digits, and internal hyphens."
            exit 1
          fi

      - name: Stage Packwiz packs
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          manifests=(*/pack.toml)
          if [ "${#manifests[@]}" -eq 0 ]; then
            echo "No Packwiz manifests found in top-level pack directories." >&2
            exit 1
          fi
          mkdir -p _site
          for manifest in "${manifests[@]}"; do
            # Copy bytes unchanged: Packwiz verifies index and file hashes.
            cp -a -- "${manifest%/pack.toml}" _site/
          done

      - name: Create pack homepage
        shell: python
        run: |
          import html
          from pathlib import Path
          import tomllib
          from urllib.parse import quote

          links = []
          for manifest in sorted(Path("_site").glob("*/pack.toml")):
              pack = tomllib.loads(manifest.read_text())
              href = quote(manifest.relative_to("_site").as_posix())
              name = html.escape(pack.get("name", manifest.parent.name))
              folder = html.escape(manifest.parent.name)
              links.append(f'<li><a href="{href}">{name}</a><br><small>{folder}/pack.toml</small></li>')
          page = """<!doctype html>
          <html lang="en"><head><meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>Emily's Minecraft Modpacks</title>
          <style>
          body { font: 18px/1.6 system-ui,sans-serif; max-width: 700px; margin: 64px auto; padding: 0 24px; color: #203329; background: #f5f7f2; }
          h1 { line-height: 1.2; } a { color: #24613c; } li { margin: 24px 0; } small { color: #54635a; }
          </style></head><body>
          <h1>Emily's Minecraft Modpacks</h1>
          <p>Use a pack's manifest link with the Packwiz installer in Prism Launcher.</p>
          <ul>""" + "".join(links) + """</ul>
          <p><a href="https://github.com/emilybelnavis/mc-modpacks">View the repository</a></p>
          </body></html>
          """
          Path("_site/index.html").write_text(page)
          # Prevent Cloudflare's SPA fallback from returning HTML for missing pack files.
          Path("_site/404.html").write_text(
              '<!doctype html><html lang="en"><meta charset="utf-8">'
              '<title>Not found</title><h1>File not found</h1></html>'
          )

      - name: Check Cloudflare Pages asset limits
        shell: python
        run: |
          from pathlib import Path

          oversized = [
              path for path in Path("_site").rglob("*")
              if path.is_file() and path.stat().st_size > 25 * 1024 * 1024
          ]
          for path in oversized:
              print(f"::error file={path.relative_to('_site')}::Asset exceeds Cloudflare Pages' 25 MiB limit. Remove it from the pack and refresh Packwiz hashes, or host it externally.")
          if oversized:
              raise SystemExit(1)

      # Repository secrets:
      # CLOUDFLARE_API_TOKEN: Account > Cloudflare Pages > Edit for the target account.
      # CLOUDFLARE_ACCOUNT_ID: The account containing the Pages project.
      - name: Deploy to Cloudflare Pages
        id: deployment
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy _site --project-name=${{ inputs.project_name }} --branch=main

      - name: Show deployment URL
        env:
          DEPLOYMENT_URL: ${{ steps.deployment.outputs.deployment-url }}
        run: |
          printf 'Cloudflare Pages deployment: %s\n' "$DEPLOYMENT_URL" >> "$GITHUB_STEP_SUMMARY"
