#Internal migration marker. Do not edit by hand: the mod uses this to force-correct
#specific values exactly once when their shipped default changes between versions,
#so a config from an older release does not silently keep reading a stale number.
#Editing this either skips a pending correction or re-applies one that already ran.
# Default: 0
# Range: > 0
configVersion = 3

[pathways]
	#VCC Mk IV vehicles on a route keep their own chunks loaded (under them, and along the line ahead of them),
	#so a loop keeps running with its owner at the other end of the map. Off: a route runs only where players are.
	routeChunkLoading = true
	#Vehicles on routes that may hold chunks loaded at once, server-wide. The rest wait parked,
	#"Waiting for a chunk budget", and set off as soon as one finishes or is paused.
	# Default: 8
	# Range: 0 ~ 256
	maxRouteVehicles = 8
	#Chunks either side of a route vehicle, and of its line ahead, that it keeps loaded.
	# Default: 1
	# Range: 0 ~ 4
	routeChunkRadius = 1
	#Nodes one pathway may have.
	# Default: 512
	# Range: 16 ~ 512
	maxNodes = 512
	#Pathways one player may own in one dimension (operators are not limited).
	# Default: 64
	# Range: 1 ~ 1024
	maxPerPlayer = 64

[data]
	#Max samples stored per display panel (default 600 = 10 min at 1/sec)
	# Default: 600
	# Range: 60 ~ 6000
	panelBufferSize = 600
	#Max samples stored per recorder (default 1800 = 30 min at 1/sec)
	# Default: 1800
	# Range: 60 ~ 18000
	recorderBufferSize = 1800
	#Ticks between samples (20 = 1 second). Lower = more resolution, more memory
	# Default: 20
	# Range: 1 ~ 200
	sampleIntervalTicks = 20

[display]
	#Passive refresh interval for stats-link auto-read sources (20 = default, 10 = high refresh, 5 = aggressive)
	# Default: 20
	# Range: 5 ~ 20
	statsLinkPassiveRefreshTicks = 20
	#Responsive refresh cap for live stats-link telemetry. Effective cadence uses the lower of this and statsLinkPassiveRefreshTicks. Default 5 for snappier AERO/Simulated updates.
	# Default: 5
	# Range: 5 ~ 20
	responsiveStatsLinkRefreshTicks = 5

[export]
	#Allow CSV export from recorders
	enableCsvExport = true
	#Auto-export interval in minutes (0 = disabled)
	# Default: 0
	# Range: 0 ~ 60
	csvAutoExportIntervalMinutes = 0

[dashboard]
	#Minimum multiblock blocks (W*H) to auto-activate dashboard mode
	# Default: 6
	# Range: 4 ~ 64
	dashboardMinBlocks = 6
	#Minimum width or height to allow dashboard (prevents thin strips)
	# Default: 3
	# Range: 2 ~ 8
	dashboardMinDimension = 3
	#Enable scrolling alert ticker in dashboard mode
	dashboardTickerEnabled = true
	#Ticker scroll speed in pixels per texture update (1-5)
	# Default: 1
	# Range: 1 ~ 5
	dashboardTickerSpeed = 1

[topology]
	#Default maximum nodes in topology map (higher = more CPU). Panel settings can lower this per display.
	# Default: 200
	# Range: 10 ~ 1000
	topologyMaxNodes = 200
	#Radius to search for kinetic seed blocks
	# Default: 5
	# Range: 1 ~ 16
	topologyScanRadius = 5
	#Force-directed layout iterations (higher = better layout, more CPU)
	# Default: 150
	# Range: 30 ~ 300
	topologyLayoutIterations = 150
	#Force-directed layout iterations for the full train map screen (higher = better layout, more CPU)
	# Default: 180
	# Range: 30 ~ 500
	trainMapLayoutIterations = 180

#Topology Scanner blocks. Budgets are element counts, never radii: kinetic
#networks are shaped like the buildings they run through, so a distance
#bound cuts a long belt run in half and wastes itself on four machines at
#the corners of a chunk.
[topologyScanner]
	#Elements one Topology Scanner sweep may reach
	# Default: 64
	# Range: 8 ~ 4096
	scannerBudgetField = 64
	#Elements one Advanced Topology Scanner sweep may reach
	# Default: 128
	# Range: 8 ~ 4096
	scannerBudgetAdvanced = 128
	#Elements one Industrial Topology Scanner sweep may reach
	# Default: 512
	# Range: 8 ~ 4096
	scannerBudgetIndustrial = 512
	#Elements per tick a Topology Scanner sweeps (higher = faster scan, more CPU per tick)
	# Default: 4
	# Range: 1 ~ 128
	scannerRateField = 4
	#Elements per tick an Advanced Topology Scanner sweeps
	# Default: 8
	# Range: 1 ~ 128
	scannerRateAdvanced = 8
	#Elements per tick an Industrial Topology Scanner sweeps
	# Default: 16
	# Range: 1 ~ 128
	scannerRateIndustrial = 16
	#Stress units per RPM the inline Topology Scanner draws (16 su at 8 RPM, 512 su at 256 RPM)
	# Default: 2.0
	# Range: 0.0 ~ 64.0
	scannerStressField = 2.0
	#Stress units per RPM the inline Advanced Topology Scanner draws
	# Default: 4.0
	# Range: 0.0 ~ 64.0
	scannerStressAdvanced = 4.0
	#Stress units per RPM the inline Industrial Topology Scanner draws
	# Default: 8.0
	# Range: 0.0 ~ 64.0
	scannerStressIndustrial = 8.0
	#Ticks between full re-sweeps when the network has not changed. A changed network re-sweeps immediately regardless.
	# Default: 200
	# Range: 40 ~ 1200
	scannerRescanIntervalTicks = 200
	#Ticks between live RPM/stress updates sent to an open scanner screen
	# Default: 10
	# Range: 1 ~ 100
	scannerLiveSyncIntervalTicks = 10
	#Most elements the world overlay will outline at once
	# Default: 256
	# Range: 16 ~ 2048
	scannerOverlayMaxElements = 256
	#Blocks from the camera the world overlay draws to
	# Default: 48.0
	# Range: 8.0 ~ 192.0
	scannerOverlayRange = 48.0

