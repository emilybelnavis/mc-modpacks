#Storage upgrades. Three degrees of Slot Upgrade and three of Stack Upgrade, installed in a block's
#Upgrades rack. Degrees multiply: a rack holding one of each is 1.5 * 2 * 4 = 12 times. The two maxima
#below are the ceilings that product is clamped to, and they are set to exactly what one full set
#earns, so duplicate upgrades can never exceed a set. Lowering a maximum is safe at any time: a
#container never shrinks below the slots its contents already occupy, so an overfull block keeps
#everything and simply refuses to give its upgrades back until it has been emptied.
[upgrades]
	#What a first-degree storage upgrade multiplies by.
	# Default: 1.5
	# Range: 1.0 ~ 64.0
	upgradeMultiplierFirst = 1.5
	#What a second-degree storage upgrade multiplies by.
	# Default: 2.0
	# Range: 1.0 ~ 64.0
	upgradeMultiplierSecond = 2.0
	#What a third-degree storage upgrade multiplies by.
	# Default: 4.0
	# Range: 1.0 ~ 64.0
	upgradeMultiplierThird = 4.0
	#Most rows of nine a Security Locker's grid can reach. Default 36 is the base three rows times a full set's 12. The grid shows six rows and scrolls past them.
	# Default: 36
	# Range: 3 ~ 256
	lockerMaxRows = 36
	#Most items one Security Locker slot can hold. Default 768 is a normal stack of 64 times a full set's 12. Items that do not stack at all are never deepened.
	# Default: 768
	# Range: 64 ~ 8192
	lockerMaxStack = 768

[experimental]
	#Show experimental, in-development items (the VCC Mk II, the VCC Mk III, the Vehicle Control Unit, the Stats Display Mk2, the Holographic Projector Mk III, and the Aeronautics Hinge) in the creative menu and JEI, and enable the crafting recipes for the ones that have them. Off by default because they are unfinished and may change or break. They stay obtainable with /give regardless of this setting.
	showExperimentalBlocks = false

#Forge Energy. The mod's advanced electronics (avionics, sensors, screens, lighting, comms) each keep a small internal FE buffer that external FE networks can charge, and a block whose buffer runs dry goes inert until it is powered again. This is the normal way the mod works; it is not optional. Create kinetic power stays the mechanical side; FE only powers electronics. Simple gauges, passive readouts, and utility blocks never need FE. Changes may require a restart.
[power]
	#Creative energy. When true, every block below runs on free power: buffers read full, nothing drains,
	#and no block can ever cut off. Intended for creative building, testing and map making, where wiring a
	#grid to each screen is busywork. Generation, wiring and storage still work normally, they simply have
	#nothing to feed.
	creativeEnergy = false
	#Show a one-line notice in chat on world join saying that the mod's electronics run on Forge Energy
	#and pointing at creativeEnergy. Shown only while creativeEnergy is off; set false to silence it.
	showLoginReminder = true
	#Sub-linear scaling for blocks whose load grows with how many sources are linked (currently the Stats Display).
	#Draw multiplier = sourceCount ^ exponent, so extra sources cost progressively less each.
	#1.0 is fully linear (10 sources = 10x). The 0.85 default gives 1 source 1.0x, 2 sources 1.8x, 10 sources 7.1x, 20 sources 12.8x.
	#Lower values flatten the curve further.
	# Default: 0.85
	# Range: 0.5 ~ 1.0
	sourceLoadExponent = 0.85
	#Buffer percent a cut-off block must charge back up to before it restarts.
	#This is hysteresis, and it matters more than it sounds: without it a supply that is even slightly
	#short flips a block between running and dead every few ticks, which stops and restarts flight
	#governors, strobes stage lights, and rebuilds holograms over and over.
	#A cut-off block charges like a capacitor and wakes up once, at this level.
	#0 restores the old edge-triggered behaviour.
	# Default: 25
	# Range: 0 ~ 90
	rebootThresholdPct = 25

