[dimension_settings]
	#Settings for the Steamworks Realm flat dimension generator
	#The default biome for the Steamworks Realm dimension.
	biome = "create_dimension:mining"
	#Whether to generate lakes in the flat dimension.
	lakes = false
	#Whether to generate features (ores, structures, etc.) in the flat dimension.
	features = true
	#List of flat world layers formatted as 'block_id, height'.
	#Bottom-to-top order starting from min build height (Y = -64).
	flat_layers = ["minecraft:bedrock, 1", "minecraft:end_stone, 64", "minecraft:netherrack, 64", "minecraft:deepslate, 64", "minecraft:stone, 119", "minecraft:andesite, 40", "minecraft:dirt, 4", "minecraft:grass_block, 1"]

	[dimension_settings.layer_heights]
		#Individual layer block heights in the flat generator
		#Bedrock layer thickness (starts at Y = -64)
		# Default: 1
		# Range: 0 ~ 256
		bedrock_height = 1
		#End Stone layer thickness (Y = -63 to 0)
		# Default: 64
		# Range: 0 ~ 512
		end_stone_height = 64
		#Netherrack layer thickness (Y = 1 to 64)
		# Default: 64
		# Range: 0 ~ 512
		netherrack_height = 64
		#Deepslate layer thickness (Y = 65 to 128)
		# Default: 64
		# Range: 0 ~ 512
		deepslate_height = 64
		#Stone layer thickness (Y = 129 to 247)
		# Default: 119
		# Range: 0 ~ 512
		stone_height = 119
		#Andesite layer thickness (Y = 248 to 287)
		# Default: 40
		# Range: 0 ~ 512
		andesite_height = 40
		#Dirt layer thickness (Y = 288 to 291)
		# Default: 4
		# Range: 0 ~ 64
		dirt_height = 4
		#Grass Block layer thickness (Y = 292)
		# Default: 1
		# Range: 0 ~ 64
		grass_block_height = 1

[ore_generation]
	#Settings for Layered Ore generation in the Steamworks Realm
	#Controls distance and empty spacing between ore spawns.
	#1.0 = Generates ores in every chunk.
	#0.75 = Generates ores in 75% of chunks (spaces out ore clusters).
	# Default: 0.75
	# Range: 0.0 ~ 1.0
	chunk_spawn_chance = 0.75
	#Multiplier for total vein count per chunk.
	# Default: 0.8
	# Range: 0.0 ~ 64.0
	global_ore_multiplier = 0.8
	#Multiplier for vein size (number of ore blocks per cluster).
	# Default: 0.9
	# Range: 0.0 ~ 64.0
	global_vein_size_multiplier = 0.9

	[ore_generation.layer_boundaries]
		#Y-level boundaries for each ore generation layer
		#Minimum Y level for End ores
		# Default: -63
		# Range: -64 ~ 704
		end_min_y = -63
		#Maximum Y level for End ores
		# Default: 0
		# Range: -64 ~ 704
		end_max_y = 0
		#Minimum Y level for Nether ores
		# Default: 1
		# Range: -64 ~ 704
		nether_min_y = 1
		#Maximum Y level for Nether ores
		# Default: 64
		# Range: -64 ~ 704
		nether_max_y = 64
		#Minimum Y level for Deepslate ores
		# Default: 65
		# Range: -64 ~ 704
		deepslate_min_y = 65
		#Maximum Y level for Deepslate ores
		# Default: 128
		# Range: -64 ~ 704
		deepslate_max_y = 128
		#Minimum Y level for Stone/Andesite ores
		# Default: 129
		# Range: -64 ~ 704
		stone_min_y = 129
		#Maximum Y level for Stone/Andesite ores (covers Stone and Andesite layers)
		# Default: 287
		# Range: -64 ~ 704
		stone_max_y = 287
