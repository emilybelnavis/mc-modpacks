	#Maximum players simultaneously using one Unlimited-ON vending machine.
	# Default: 10
	# Range: 1 ~ 128
	vm_unlimited_max_concurrent_users = 10
	#Maximum players simultaneously using one Unlimited-OFF vending machine.
	# Default: 5
	# Range: 1 ~ 128
	vm_limited_max_concurrent_users = 5
	#Maximum players simultaneously using one ATM.
	# Default: 10
	# Range: 1 ~ 128
	atm_max_concurrent_users = 10
	#Maximum players simultaneously using one TeleStation.
	# Default: 20
	# Range: 1 ~ 128
	telestation_max_concurrent_users = 20

[telestation]
	#Progressive TeleStation fare tiers as meters=price_per_meter_in_active_currency. Use *=price for all remaining distance.
	fare_tiers = ["1000=1.00", "1000=0.80", "1000=0.70", "*=0.60"]

[migration]
	#Internal config migration version. Do not edit.
	# Default: 7
	# Range: 0 ~ 7
	config_version = 7
