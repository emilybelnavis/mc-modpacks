	#Minimum vending machine buyback multiplier. 0.50 means VMs buy from players for 50% of sell price.
	# Default: 0.5
	# Range: 0.0 ~ 1.0
	vm_buy_min = 0.5
	#Maximum vending machine buyback multiplier. 0.70 means VMs buy from players for 70% of sell price.
	# Default: 0.7
