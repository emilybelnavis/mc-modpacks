	#Maximum items in the VM sell-input cell. Default: 1000. Maximum: 10000. A selected stock cell also reserves its existing one-item template.
	# Default: 1000
	# Range: 1 ~ 10000
	vm_item_slot_max_stack = 1000

[currency]
	#World currency policy. Valid values: DOLLAR, YEN, POUND, UNLISTED.
	#UNLISTED lets every ATM, VM, and TeleStation select its own transaction currency.
	currency_mode = "DOLLAR"
	#Legacy setting kept for old configs. Use currency_mode instead.
	use_yen = false
	#Dollar to Pound conversion shown as: $1.00 = £1.0.00
	#Use pounds.shillings.pence format. Example: 1.2.13 means $1.00 = £1 2s 13p.
	atm_exchange_rate_pounds_per_dollar = "1.0.00"
	#Dollar to Yen conversion shown as: $1.00 = ¥2000
	#Stored as yen per dollar. 2000 means $1.00 = ¥2000.
	# Default: 2000
	# Range: > 1
	atm_exchange_rate_yen_per_dollar = 2000

[atm]
	#Default ATM loan interest percent per 365 Minecraft days.
	# Default: 2.0
	# Range: -1000.0 ~ 1000.0
	default_loan_interest_percent = 2.0
	#Default ATM loan due time in Minecraft days.
	# Default: 365
	# Range: 1 ~ 7300
	default_loan_term_days = 365
	#Maximum loan term allowed in the ATM UI.
	# Default: 7300
	# Range: 1 ~ 100000
	max_loan_days = 7300

